<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanzador de d20 Universal Pro - Animado Optimizado</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --border-color: #2a354d;
            --text-main: #ffffff;
            --text-muted: #a3adc2;
            --input-bg: #0b0f19;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --result-bg: #090d16;
            --card-radius: 16px;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body.theme-style2 {
            --bg-color: #05050a;
            --card-bg: #0e121e;
            --accent-color: #06b6d4;
            --accent-hover: #0891b2;
            --border-color: #1e293b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: #05050a;
            --success-color: #22c55e;
            --danger-color: #f43f5e;
            --result-bg: #05050a;
            --card-radius: 12px;
        }

        body.theme-style3 {
            --bg-color: #0a0203;
            --card-bg: #1a080a;
            --accent-color: #991b1b;
            --accent-hover: #b91c1c;
            --border-color: #450a0a;
            --text-main: #ffffff;
            --text-muted: #fca5a5;
            --input-bg: #0a0203;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --result-bg: #050102;
            --card-radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body.theme-style3 {
            background-image: radial-gradient(circle at 50% 0%, #450a0a 0%, var(--bg-color) 70%);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 24px;
            width: 100%;
            max-width: 440px;
            height: 640px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .tab-content {
            display: none;
            flex: 1;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .mod-controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 6px;
        }

        .btn-small {
            padding: 6px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .btn-small:hover {
            border-color: var(--accent-color);
        }

        .roll-options {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-roll {
            padding: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-roll:hover {
            background-color: var(--accent-hover);
        }

        .btn-alt {
            padding: 10px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-alt:hover {
            border-color: var(--accent-color);
        }

        /* --- RESULT BOX & SMALL INTEGRATED DICE --- */
        .result-box {
            height: 115px;
            padding: 10px;
            background-color: var(--result-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .result-box.visible {
            opacity: 1;
            visibility: visible;
        }

        .dice-stage {
            width: 60px;
            height: 60px;
            perspective: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .d20-icon {
            width: 50px;
            height: 50px;
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform, opacity;
        }

        .d20-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--card-bg);
            stroke: var(--accent-color);
            stroke-width: 2;
        }

        .d20-number {
            position: absolute;
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            pointer-events: none;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .d20-icon.spinning {
            animation: roll3D 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes roll3D {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(0.4);
                opacity: 0.5;
            }
            50% {
                transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg) scale(1.2);
            }
            100% {
                transform: rotateX(1080deg) rotateY(720deg) rotateZ(360deg) scale(1);
                opacity: 1;
            }
        }

        .crit-20 { color: var(--success-color) !important; text-shadow: 0 0 8px var(--success-color); }
        .crit-1 { color: var(--danger-color) !important; text-shadow: 0 0 8px var(--danger-color); }

        .details {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* --- BIG OVERLAY DICE MODAL OPTIMIZADO --- */
        .dice-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 15, 0.82);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .dice-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-stage {
            width: 220px;
            height: 220px;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .overlay-d20 {
            width: 190px;
            height: 190px;
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Forzar aceleración por hardware */
            will-change: transform, opacity;
        }

        .overlay-d20 svg {
            width: 100%;
            height: 100%;
            fill: var(--card-bg);
            stroke: var(--accent-color);
            stroke-width: 2.5;
            /* Sombra fija de caja ligera en lugar de drop-shadow pesado sobre el SVG */
            filter: drop-shadow(0 0 10px var(--accent-color));
        }

        .overlay-d20 .overlay-number {
            position: absolute;
            font-size: 4.5rem;
            font-weight: 900;
            color: #ffffff;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0,0,0,0.9);
        }

        .overlay-d20.spinning {
            animation: roll3DBig 0.85s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes roll3DBig {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(0.2);
                opacity: 0.3;
            }
            50% {
                transform: rotateX(1080deg) rotateY(540deg) rotateZ(270deg) scale(1.35);
            }
            100% {
                transform: rotateX(1440deg) rotateY(1080deg) rotateZ(360deg) scale(1);
                opacity: 1;
            }
        }

        .overlay-info {
            text-align: center;
            max-width: 380px;
            padding: 0 20px;
        }

        .overlay-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .overlay-breakdown {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .overlay-close-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* --- STATS & FOOTER --- */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-history-toggle {
            padding: 5px 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .history-panel {
            position: absolute;
            top: 0;
            left: 100%;
            margin-left: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 16px;
            width: 260px;
            height: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .history-panel.active { display: flex; }

        .history-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .history-item {
            font-size: 0.75rem;
            color: var(--text-main);
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .preset-editor-list {
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 4px;
        }

        .preset-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
        }

        .preset-row input[type="text"] { flex: 2; }
        .preset-row input[type="number"] { flex: 1; }

        .btn-danger {
            background-color: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #991b1b;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .btn-secondary {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-success {
            background-color: #059669;
            color: #ffffff;
        }

        .setting-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .theme-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .credits-footer {
            position: fixed;
            bottom: 12px;
            right: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
            font-weight: 600;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .history-panel {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                margin-left: 0;
                width: 90%;
                max-width: 320px;
                height: 80vh;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div>
        <div class="header">
            <h1>Lanzador d20 Pro</h1>
            <div class="subtitle">Herramienta Universal Personalizable</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rollTab')">🎲 Lanzar Dado</button>
            <button class="tab-btn" onclick="switchTab('configTab')">⚙️ Configuración</button>
        </div>
    </div>

    <div id="rollTab" class="tab-content active">
        <div>
            <div class="form-group">
                <label for="presetSelect">Seleccionar Preset:</label>
                <select id="presetSelect" onchange="applySelectedPreset()"></select>
            </div>

            <div class="form-group">
                <label for="action">Acción / Habilidad:</label>
                <input type="text" id="action" placeholder="Ej. Ataque, Sigilo, Atletismo...">
            </div>

            <div class="form-group">
                <label for="modifier">Modificador (+ o -):</label>
                <input type="number" id="modifier" value="0">
                <div class="mod-controls">
                    <button class="btn-small" onclick="addMod(-5)">-5</button>
                    <button class="btn-small" onclick="addMod(-1)">-1</button>
                    <button class="btn-small" style="color: var(--accent-color);" onclick="resetMod()">0</button>
                    <button class="btn-small" onclick="addMod(1)">+1</button>
                    <button class="btn-small" onclick="addMod(5)">+5</button>
                </div>
            </div>

            <div class="roll-options">
                <button class="btn-alt" onclick="rollD20('dis')">Desventaja</button>
                <button class="btn-roll" onclick="rollD20('normal')">Lanzar d20</button>
                <button class="btn-alt" onclick="rollD20('adv')">Ventaja</button>
            </div>

            <div class="result-box" id="resultBox">
                <div class="details" id="actionName"></div>
                
                <div class="dice-stage">
                    <div class="d20-icon" id="d20Icon">
                        <svg viewBox="0 0 100 100">
                            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" />
                            <polyline points="50,5 50,95" />
                            <polyline points="10,25 90,75" />
                            <polyline points="10,75 90,25" />
                            <polygon points="50,25 75,65 25,65" />
                        </svg>
                        <span class="d20-number" id="finalTotal">0</span>
                    </div>
                </div>

                <div class="details" id="breakdown"></div>
            </div>
        </div>

        <div class="stats">
            <span>Tiradas: <strong id="totalRollsCount">0</strong> | Promedio: <strong id="avgRoll">0</strong></span>
            <button class="btn-history-toggle" onclick="toggleHistory()">📜 Historial</button>
        </div>
    </div>

    <div id="configTab" class="tab-content">
        <div>
            <label>Estilo Visual:</label>
            <div class="theme-selector">
                <button class="theme-btn active" id="themeBtn1" onclick="setTheme(1)">Violeta</button>
                <button class="theme-btn" id="themeBtn2" onclick="setTheme(2)">Neón</button>
                <button class="theme-btn" id="themeBtn3" onclick="setTheme(3)">Rojo Tinto</button>
            </div>

            <div class="setting-toggle">
                <span>Efecto de sonido al lanzar</span>
                <input type="checkbox" id="soundToggle" checked style="width: auto;">
            </div>

            <div class="setting-toggle">
                <span>Modo Dado Grande Centrado (Superpuesto)</span>
                <input type="checkbox" id="overlayDiceToggle" checked style="width: auto;">
            </div>

            <label>Editor de Presets:</label>
            <div class="preset-editor-list" id="presetEditorList"></div>
        </div>

        <div>
            <button class="btn-action btn-secondary" onclick="addPresetRow()">+ Añadir Preset</button>
            <button class="btn-action btn-success" onclick="savePresetsFromEditor()">💾 Guardar Presets</button>
            <button class="btn-action btn-secondary" onclick="resetDefaultPresets()">🔄 Restablecer Presets a 0</button>
            <button class="btn-action btn-secondary" style="color: #f87171;" onclick="clearHistory()">🗑️ Limpiar Historial</button>
        </div>
    </div>

    <div class="history-panel" id="historyPanel">
        <div class="history-title">
            <span>📜 Historial</span>
            <button class="btn-small" style="padding: 2px 6px;" onclick="toggleHistory()">✕</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>
</div>

<!-- OVERLAY SUPERPUESTO PARA DADO GRANDE -->
<div class="dice-overlay" id="diceOverlay" onclick="closeOverlay()">
    <div class="overlay-stage">
        <div class="overlay-d20" id="overlayD20">
            <svg viewBox="0 0 100 100">
                <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" />
                <polyline points="50,5 50,95" />
                <polyline points="10,25 90,75" />
                <polyline points="10,75 90,25" />
                <polygon points="50,25 75,65 25,65" />
            </svg>
            <span class="overlay-number" id="overlayTotal">?</span>
        </div>
    </div>
    <div class="overlay-info">
        <div class="overlay-title" id="overlayActionName">Tirada Libre</div>
        <div class="overlay-breakdown" id="overlayBreakdown">---</div>
        <div class="overlay-close-hint">( Haz clic en cualquier lugar para cerrar )</div>
    </div>
</div>

<div class="credits-footer">creado por prox</div>

<script>
    const defaultPresets = [
        { name: "Ataque Principal", mod: 0 },
        { name: "Ataque Mágico / Conjuro", mod: 0 },
        { name: "Iniciativa", mod: 0 },
        { name: "Percepción (SAB)", mod: 0 },
        { name: "Sigilo (DES)", mod: 0 },
        { name: "Atletismo (FUE)", mod: 0 },
        { name: "Investigación (INT)", mod: 0 },
        { name: "Persuasión (CAR)", mod: 0 },
        { name: "Salvación Fuerza", mod: 0 },
        { name: "Salvación Destreza", mod: 0 },
        { name: "Salvación Constitución", mod: 0 },
        { name: "Salvación Inteligencia", mod: 0 },
        { name: "Salvación Sabiduría", mod: 0 },
        { name: "Salvación Carisma", mod: 0 }
    ];

    let userPresets = [];
    let totalRolls = 0;
    let sumRawRolls = 0;
    let rollTimer = null;
    let animInterval = null;

    function setTheme(styleNum) {
        document.body.classList.remove('theme-style2', 'theme-style3');
        document.getElementById('themeBtn1').classList.remove('active');
        document.getElementById('themeBtn2').classList.remove('active');
        document.getElementById('themeBtn3').classList.remove('active');

        if (styleNum === 2) {
            document.body.classList.add('theme-style2');
            document.getElementById('themeBtn2').classList.add('active');
        } else if (styleNum === 3) {
            document.body.classList.add('theme-style3');
            document.getElementById('themeBtn3').classList.add('active');
        } else {
            document.getElementById('themeBtn1').classList.add('active');
        }
    }

    function playDiceSound() {
        if (!document.getElementById('soundToggle').checked) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }

    function init() {
        const saved = localStorage.getItem('d20_pro_presets_v3');
        if (saved) {
            try { userPresets = JSON.parse(saved); } catch(e) { userPresets = [...defaultPresets]; }
        } else {
            userPresets = [...defaultPresets];
        }
        renderPresetDropdown();
        renderPresetEditor();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabId === 'rollTab') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('rollTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('configTab').classList.add('active');
        }
    }

    function toggleHistory() {
        const panel = document.getElementById('historyPanel');
        panel.classList.toggle('active');
    }

    function closeOverlay() {
        document.getElementById('diceOverlay').classList.remove('active');
    }

    function renderPresetDropdown() {
        const select = document.getElementById('presetSelect');
        select.innerHTML = '<option value="custom|0">-- Tirada Manual / Personalizada --</option>';

        userPresets.forEach((p) => {
            const opt = document.createElement('option');
            const modSign = p.mod >= 0 ? `+${p.mod}` : `${p.mod}`;
            opt.value = `${p.name}|${p.mod}`;
            opt.textContent = `${p.name} (${modSign})`;
            select.appendChild(opt);
        });
    }

    function renderPresetEditor() {
        const container = document.getElementById('presetEditorList');
        container.innerHTML = '';

        userPresets.forEach((p, index) => {
            const row = document.createElement('div');
            row.className = 'preset-row';
            row.innerHTML = `
                <input type="text" class="edit-name" value="${p.name}" placeholder="Nombre">
                <input type="number" class="edit-mod" value="${p.mod}" placeholder="Mod">
                <button class="btn-danger" onclick="removePresetRow(${index})">✕</button>
            `;
            container.appendChild(row);
        });
    }

    function applySelectedPreset() {
        const val = document.getElementById('presetSelect').value;
        if (val.includes('|')) {
            const [name, mod] = val.split('|');
            if (name !== 'custom') {
                document.getElementById('action').value = name;
                document.getElementById('modifier').value = parseInt(mod);
            }
        }
    }

    function addPresetRow() {
        userPresets.push({ name: "Nueva Habilidad", mod: 0 });
        renderPresetEditor();
    }

    function removePresetRow(index) {
        userPresets.splice(index, 1);
        renderPresetEditor();
    }

    function savePresetsFromEditor() {
        const rows = document.querySelectorAll('.preset-row');
        const updated = [];
        rows.forEach(row => {
            const name = row.querySelector('.edit-name').value.trim();
            const mod = parseInt(row.querySelector('.edit-mod').value) || 0;
            if (name) updated.push({ name, mod });
        });
        userPresets = updated;
        localStorage.setItem('d20_pro_presets_v3', JSON.stringify(userPresets));
        renderPresetDropdown();
        alert('¡Presets guardados exitosamente!');
        switchTab('rollTab');
    }

    function resetDefaultPresets() {
        if (confirm('¿Quieres restablecer todos los presets a los nombres por defecto con modificador 0?')) {
            userPresets = JSON.parse(JSON.stringify(defaultPresets));
            localStorage.setItem('d20_pro_presets_v3', JSON.stringify(userPresets));
            renderPresetDropdown();
            renderPresetEditor();
            alert('Presets restablecidos a 0.');
        }
    }

    function clearHistory() {
        document.getElementById('historyList').innerHTML = '';
        totalRolls = 0;
        sumRawRolls = 0;
        document.getElementById('totalRollsCount').textContent = '0';
        document.getElementById('avgRoll').textContent = '0';
        alert('Historial borrado.');
    }

    function addMod(val) {
        const input = document.getElementById('modifier');
        input.value = (parseInt(input.value) || 0) + val;
    }

    function resetMod() {
        document.getElementById('modifier').value = 0;
    }

    function rollD20(mode) {
        playDiceSound();

        if (rollTimer) clearTimeout(rollTimer);
        if (animInterval) clearInterval(animInterval);

        const isOverlayMode = document.getElementById('overlayDiceToggle').checked;

        const d20Icon = document.getElementById('d20Icon');
        const finalTotalEl = document.getElementById('finalTotal');
        const resultBox = document.getElementById('resultBox');

        const overlay = document.getElementById('diceOverlay');
        const overlayD20 = document.getElementById('overlayD20');
        const overlayTotalEl = document.getElementById('overlayTotal');

        const actionInput = document.getElementById('action').value.trim();
        const modInput = parseInt(document.getElementById('modifier').value) || 0;

        let roll1 = Math.floor(Math.random() * 20) + 1;
        let roll2 = Math.floor(Math.random() * 20) + 1;
        let selectedRoll = roll1;
        let modeText = '';

        if (mode === 'adv') {
            selectedRoll = Math.max(roll1, roll2);
            modeText = ` [Ventaja: ${roll1}, ${roll2}]`;
        } else if (mode === 'dis') {
            selectedRoll = Math.min(roll1, roll2);
            modeText = ` [Desventaja: ${roll1}, ${roll2}]`;
        }

        const total = selectedRoll + modInput;

        // Limpiar clases de critico previo
        finalTotalEl.className = 'd20-number';
        overlayTotalEl.className = 'overlay-number';

        if (isOverlayMode) {
            overlay.classList.add('active');
            overlayD20.classList.remove('spinning');
            void overlayD20.offsetWidth;
            overlayD20.classList.add('spinning');

            resultBox.classList.add('visible');
            d20Icon.classList.remove('spinning');

            // Optimización: Mostrar un signo de interrogación durante el giro en lugar de forzar repintados continuos
            overlayTotalEl.textContent = '?';
            finalTotalEl.textContent = '?';

            // Reducida la frecuencia de cambio de números a 120ms para evitar saturate CPU/GPU
            animInterval = setInterval(() => {
                const randVal = Math.floor(Math.random() * 20) + 1;
                overlayTotalEl.textContent = randVal;
                finalTotalEl.textContent = randVal;
            }, 120);

        } else {
            closeOverlay();
            d20Icon.classList.remove('spinning');
            void d20Icon.offsetWidth;
            d20Icon.classList.add('spinning');
            resultBox.classList.add('visible');

            finalTotalEl.textContent = '?';

            animInterval = setInterval(() => {
                const randVal = Math.floor(Math.random() * 20) + 1;
                finalTotalEl.textContent = randVal;
            }, 120);
        }

        // Al finalizar la animación (800ms)
        rollTimer = setTimeout(() => {
            clearInterval(animInterval);

            finalTotalEl.textContent = total;
            overlayTotalEl.textContent = total;

            d20Icon.classList.remove('spinning');
            overlayD20.classList.remove('spinning');

            let critTag = '';
            if (selectedRoll === 20) {
                finalTotalEl.classList.add('crit-20');
                overlayTotalEl.classList.add('crit-20');
                critTag = ' ★ ¡CRÍTICO!';
            } else if (selectedRoll === 1) {
                finalTotalEl.classList.add('crit-1');
                overlayTotalEl.classList.add('crit-1');
                critTag = ' ✖ ¡FALLO CRÍTICO!';
            }

            const actionNameText = actionInput ? `Acción: ${actionInput}` : 'Tirada Libre';
            const modSign = modInput >= 0 ? `+ ${modInput}` : `- ${Math.abs(modInput)}`;
            const breakdownText = `Dado: ${selectedRoll} (${modSign})${modeText}${critTag}`;

            document.getElementById('actionName').textContent = actionNameText;
            document.getElementById('breakdown').textContent = breakdownText;

            document.getElementById('overlayActionName').textContent = actionNameText;
            document.getElementById('overlayBreakdown').textContent = breakdownText;

            totalRolls++;
            sumRawRolls += selectedRoll;
            document.getElementById('totalRollsCount').textContent = totalRolls;
            document.getElementById('avgRoll').textContent = (sumRawRolls / totalRolls).toFixed(1);

            const historyList = document.getElementById('historyList');
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            const nameText = actionInput ? `${actionInput}: ` : '';
            historyItem.textContent = `${nameText}Total ${total} (Dado ${selectedRoll} ${modSign})${modeText}`;
            historyList.prepend(historyItem);

        }, 800);
    }

    init();
</script>

</body>
</html>
